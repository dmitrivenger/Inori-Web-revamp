{% extends "base.html" %}
{% from "_macros.html" import pic, arrow %}
{% block main %}
<section class="section" style="padding-top:calc(var(--header-h) + 80px)">
  <div class="container center-block reveal">
    {{ pic('contact_thanks', '', '', '340px') }}
    <h1 style="font-size:clamp(1.8rem,3.5vw,2.6rem)">{{ t.contact.thanks.title }}</h1>
    <p style="color:var(--muted);font-size:1.1rem">{{ t.contact.thanks.text }}</p>
    <a class="btn btn--primary" href="{{ u('') }}">{{ t.common.back_home }} {{ arrow() }}</a>
  </div>
</section>
{% endblock %}
