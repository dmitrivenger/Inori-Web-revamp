about:
  title: אודות INORI Finance
  description: INORI היא חברה ישראלית לשירותים פיננסיים. אנחנו מפעילים את NEVO, פלטפורמת פקטורינג הפוך, ומייצגים את Soramitsu בישראל.
  hero:
