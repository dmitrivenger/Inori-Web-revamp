    title: "למה פנקס מבוזר?"
    text: "פקטורינג נשען על אמון: שהתשלום אושר, שהשטר קיים פעם אחת בלבד, ושהבעלים הוא מי שהוא טוען שהוא. פנקס משותף נותן לכל משתתף את אותו רישום מאומת — בלי להסתמך על מיילים, גיליונות או נייר."
    points:
