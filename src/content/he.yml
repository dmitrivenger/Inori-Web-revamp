      text: מנתחים את המורכבות, מבינים את התמונה הרגולטורית ובונים מענה שמתאים לכם.
    - icon: invoice
      title: עושים, לא רק מייעצים
      text: מטפלים במסמכים, עוקבים אחרי כל תהליך ודואגים שהדברים באמת יתקדמו.
    - icon: shield
      title: עמידה מלאה ברגולציה
      text: פועלים לפי דרישות החוק ומוצאים פתרונות גמישים בתוך הכללים.
  services:
    eyebrow: שירותים
    title: שירותים פיננסיים ורגולטוריים
    text: מעבר ל-NEVO, INORI מעניקה שירותים פיננסיים ורגולטוריים מותאמים לגופים ממשלתיים, מוסדות ועסקים, מהחשיבה האסטרטגית ועד הביצוע בפועל.
  faq:
    eyebrow: שאלות נפוצות
    title: שאלות ששואלים אותנו
    items:
    - q: מה זה פקטורינג הפוך?
      a: זה מתחיל בקונה. הקונה מאשר את החשבונית, הספק יכול לבקש תשלום מוקדם, ובמועד התשלום הקונה משלם למי שמחזיק בהתחייבות באותו רגע. ב-NEVO ההתחייבות והבעלות עליה נרשמות כ-DPN.
    - q: האם הקונה צריך לשלם מוקדם יותר?
      a: לא. הקונה משלם במועד המקורי. אם ה-DPN הועבר ל-INORI, הקונה פשוט משלם ל-INORI במקום לספק, בהתאם לתנאי העסקה.
    - q: האם הספק חייב לקחת תשלום מוקדם?
      a: ממש לא. הספק יכול לבקש מימון או פשוט לחכות למועד התשלום. כל מימון כפוף לזכאות, לבדיקה, לאישור ולתנאים שסוכמו.
    - q: האם כל חשבונית מאושרת מקבלת מימון?
      a: לא. אישור חשבונית אינו אישור מימון. INORI בודקת כל חברה וכל חשבונית, והספק רואה את התנאים לפני שהוא מחליט אם להמשיך.
    - q: מה קורה אחרי שאני משאיר פרטים?
      a: נקבע שיחת היכרות קצרה, בלי עלות ובלי התחייבות, כדי להבין מה אתם צריכים ולהציע את הצעדים הבאים.
    - q: האם הפנייה שלי חסויה?
      a: כן. כל פנייה מטופלת בסודיות מלאה, ואנחנו לא מעבירים שום מידע לאף אחד בלי הסכמתכם המפורשת.
