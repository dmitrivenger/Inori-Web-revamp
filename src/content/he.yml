  story:
    title: מי אנחנו
    paragraphs:
      - "INORI היא צוות אסטרטגי-טכנולוגי המתמקד בתשתיות תשלום דיגיטליות, ברגולציה פיננסית וביישומי בלוקצ'יין. אנחנו מעניקים שירותים פיננסיים ורגולטוריים מותאמים לגופים ממשלתיים, מוסדות ועסקים — ובונים את פלטפורמת ה-DPN לתשלומים לספקים."
