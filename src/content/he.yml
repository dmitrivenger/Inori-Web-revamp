    text: 'Hyperledger Iroha היא טכנולוגיית פנקס מבוזר בקוד פתוח, ו-Soramitsu מילאה תפקיד מרכזי בפיתוחה. NEVO משתמשת ב-SORA Nexus, שמבוססת על Iroha v3, כפנקס של שטרי ה-DPN. אין צורך להתעסק עם הבלוקצ''יין עצמו: החברות פשוט עובדות בפורטל אינטרנטי.'
