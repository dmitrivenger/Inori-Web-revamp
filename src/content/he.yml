    text: "בלוקצ'יין בקוד פתוח ומבוקר הרשאות במסגרת פרויקט Hyperledger של קרן לינוקס, שתוכנן לנכסים דיגיטליים, לזהות ולמערכות תשלום בסביבות מפוקחות."
  partnership:
    eyebrow: שותפות אסטרטגית
    title: "בשותפות עם Soramitsu"
    text: "INORI היא השותפה הרשמית בישראל של Soramitsu, מפתחת מובילה של תשתיות פיננסיות מבוססות בלוקצ'יין ומערכות מטבע דיגיטלי של בנקים מרכזיים, ומהמפתחות המרכזיות של Hyperledger Iroha. השותפות מביאה לשוק הישראלי טכנולוגיה מוכחת וסטנדרטים בינלאומיים של אבטחה, פרטיות ויכולת פעולה הדדית."

