home:
  title: INORI Finance | NEVO, פקטורינג הפוך עם שטרי תשלום דיגיטליים
  description: NEVO מבית INORI Finance הופכת חשבונית שאושרה בידי הקונה לשטר תשלום דיגיטלי (DPN). הספק יכול לבקש מ-INORI תשלום מוקדם, והקונה ממשיך לשלם במועד המקורי.
  hero:
    eyebrow: NEVO מבית INORI Finance
    title: הספקים מקבלים תשלום מוקדם יותר. הקונים משלמים בדיוק בזמן.
    subtitle: הכול מתחיל בחשבונית שהקונה כבר אישר. אתם יכולים לבקש מ-INORI לקבל את התשלום מוקדם, והקונה ממשיך לשלם במועד שסוכם.
    cta_primary: דברו עם INORI
    cta_secondary: איך זה עובד
  trust:
  - פועלת באישור רשות שוק ההון, רישיונות 70208 ו-70210
  - הנציגה של Soramitsu בישראל
  - פועלת על SORA Nexus עם Hyperledger Iroha v3
  - סוקרה בכלכליסט, TheMarker וישראל היום
  problem:
    eyebrow: הפער
    title: העבודה הסתיימה. הכסף עדיין בדרך.
    text: ספקים מסיימים עבודה לעיתים חודשים לפני שהם מקבלים עליה תשלום. עד שמגיע מועד התשלום, הכסף שכבר הרוויחו פשוט ממתין בתור התשלומים של מישהו אחר.
  solution:
    eyebrow: הגישה שלנו
    title: ברגע שהקונה מאשר את החשבונית, היא הופכת להתחייבות ברורה.
    text: NEVO הופכת את החשבונית המאושרת לשטר תשלום דיגיטלי (DPN). הספק יכול לחכות למועד התשלום או לבקש מ-INORI תשלום מוקדם. אם INORI מאשרת והספק מסכים לתנאים, INORI מעבירה את הכסף, והקונה עדיין משלם במועד המקורי.
  how:
    eyebrow: איך זה עובד
    title: פקטורינג הפוך בארבעה שלבים
    steps:
    - title: הקונה מאשר את החשבונית
      text: הקונה מאשר את הספק, הסכום ומועד התשלום. NEVO מרכזת את כל הפרטים בשטר תשלום דיגיטלי (DPN) ומנפיקה אותו לספק.
    - title: הספק מחליט
      text: אפשר להחזיק ב-DPN עד מועד התשלום, או לבקש מ-INORI תשלום מוקדם. חשבונית מאושרת היא עדיין לא אישור מימון.
    - title: INORI בודקת ומשלמת
      text: INORI בוחנת את הבקשה. אם היא מאושרת והספק מסכים לתנאים, INORI משלמת בהעברה בנקאית, מאמתת את אסמכתת הבנק, וה-DPN מועבר לבעלות INORI.
    - title: הקונה משלם במועד
      text: במועד התשלום המקורי, הקונה משלם למי שמחזיק ב-DPN באותו רגע. אחרי התאמת התשלום, ה-DPN מסומן כנפרע.
  audiences:
    eyebrow: למי זה מתאים
    title: נבנה סביב שני הצדדים של החשבונית
    items:
    - key: suppliers
      img: home_audience-suppliers
