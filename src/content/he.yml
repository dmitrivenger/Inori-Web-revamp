home:
  title: "INORI Finance — שטרי תשלום דיגיטליים לתשלומים לספקים"
  description: "פלטפורמת ה-DPN של INORI הופכת התחייבויות תשלום לספקים לשטרי תשלום דיגיטליים על גבי בלוקצ'יין — כך שספקים מקבלים תשלום מוקדם ומממנים משקיעים בחובות מאומתים."
  hero:
    eyebrow: חברת פינטק בעלת רישיון · ישראל
    title: "תשלומים לספקים, שהופכים לנזילות."
    subtitle: "פלטפורמת שטר התשלום הדיגיטלי (DPN) הופכת תשלומים מאושרים לספקים לשטרים דיגיטליים על גבי בלוקצ'יין — הספקים מקבלים תשלום מוקדם, המשלמים שומרים על תנאי התשלום, והמממנים משקיעים בחובות מאומתים."
    cta_primary: מתחילים
    cta_secondary: איך DPN עובד
  trust:
    - בעלת רישיון מרשות שוק ההון
    - השותפה הרשמית של Soramitsu בישראל
    - מבוסס על Hyperledger Iroha
    - סוקרה בכלכליסט, TheMarker וישראל היום
  problem:
    eyebrow: הבעיה
    title: "ספקים מחכים חודשים לתשלום."
    text: "תנאי תשלום ארוכים כובלים הון חוזר לאורך כל שרשרת האספקה. חשבוניות ממתינות בתור, המימון איטי ומבוסס נייר, והספקים הקטנים נושאים במחיר ההמתנה."
  solution:
    eyebrow: הפתרון
    title: "שטר דיגיטלי אחד. נזילות מהיום הראשון."
    text: "עם DPN, המשלם מנפיק שטר תשלום דיגיטלי עבור חשבונית מאושרת. הספק יכול להחזיק בו עד מועד הפירעון או למכור אותו למממן ולקבל תשלום מוקדם — וכל שלב נרשם בפנקס שאינו ניתן לשינוי."
  how:
    eyebrow: איך זה עובד
    title: "מחשבונית לתשלום מוקדם בארבעה שלבים"
    steps:
      - title: המשלם מנפיק DPN
        text: "תשלום מאושר לספק מונפק כשטר תשלום דיגיטלי ונרשם בפנקס הבלוקצ'יין."
      - title: הספק מקבל את השטר
        text: "השטר מועבר לספק עם סכום ברור, מועד פירעון ותיעוד מלא."
      - title: תשלום מוקדם ממממן
        text: "הספק יכול למכור את השטר לבנק או לחברת פקטורינג ולקבל כסף מיד. העברת הבעלות נרשמת בפנקס."
      - title: פירעון במועד
        text: "במועד הפירעון המשלם משלם למחזיק הנוכחי של השטר. ההיסטוריה המלאה נשארת ניתנת לאימות."
  audiences:
    eyebrow: למי זה מתאים
    title: "פלטפורמה אחת, שלושה צדדים לכל תשלום"
    items:
      - key: payers
        title: משלמים
        subtitle: תאגידים וגופים ציבוריים
        text: "תמכו בספקים שלכם בלי לשנות את תנאי התשלום, עם שקיפות מלאה על כל התחייבות."
      - key: suppliers
        title: ספקים
        subtitle: עסקים קטנים ובינוניים ונותני שירות
        text: "הפכו תשלומים מאושרים לכסף כשאתם צריכים אותו, במקום לחכות למועד התשלום."
      - key: funders
        title: מממנים
        subtitle: בנקים וחברות פקטורינג
        text: "גישה לזרם של חובות מאומתים המגובים בהתחייבות המשלם, עם בעלות והיסטוריה שקופות."
  principles:
    eyebrow: איך אנחנו עובדים
    title: "בהירות, יציבות ודיסקרטיות"
    items:
      - icon: chat
        title: ליווי שקט וממוקד
        text: "פועלים מאחורי הקלעים, בתיאום מלא עם כל הגורמים — בלי רעש, עם תוצאות."
      - icon: ledger
        title: חשיבה מערכתית
        text: "מנתחים את המורכבות, מבינים את המבנה הרגולטורי ובונים מענה מותאם."
      - icon: invoice
        title: ביצוע בפועל, לא רק ייעוץ
        text: "מטפלים במסמכים, עוקבים אחר התהליכים ומוודאים התקדמות בפועל — בכל שלב."
      - icon: shield
        title: עמידה מלאה ברגולציה
        text: "פועלים בהתאם לדרישות החוק ומוצאים פתרונות גמישים בתוך הכללים."
  services:
    eyebrow: שירותים
    title: "מומחיות סביב הפלטפורמה"
    text: "מעבר ל-DPN, הצוות שלנו מלווה מוסדות ברישוי, בתכנון תהליכי תשלום ובהטמעה."
  press:
    eyebrow: בתקשורת
    title: "מה אומרים עלינו"
  faq:
    eyebrow: שאלות נפוצות
    title: שאלות נפוצות
    items:
      - q: מהו שטר תשלום דיגיטלי (DPN)?
        a: "DPN הוא רישום דיגיטלי של התחייבות המשלם לשלם לספק סכום מוגדר במועד מוגדר. הוא מונפק ומנוהל על גבי פנקס בלוקצ'יין, כך שהבעלות וההיסטוריה תמיד ניתנות לאימות."
      - q: איך ספק מקבל תשלום מוקדם?
        a: "לאחר שהספק מחזיק ב-DPN, הוא יכול למכור את השטר למממן משתתף ולקבל תשלום לפני מועד הפירעון. במועד הפירעון המשלם משלם למממן."
      - q: האם המשלם צריך לשנות את תנאי התשלום שלו?
        a: "לא. המשלם שומר על התנאים הקיימים ומשלם במועד המקורי — למי שמחזיק בשטר באותו מועד."
      - q: מה קורה אחרי שאני משאיר פרטים?
        a: "נקבע שיחת היכרות קצרה, ללא עלות וללא התחייבות, כדי להבין את הצרכים שלכם ולהציע את הצעדים הבאים."
      - q: האם הפנייה שלי חסויה?
        a: "כן. כל הפניות מטופלות בסודיות מלאה, ושום מידע לא מועבר לאף גורם ללא הסכמתכם המפורשת."
  cta:
    title: "מוכנים לשחרר את הנזילות בשרשרת האספקה שלכם?"
    text: "ספרו לנו אם אתם משלמים, ספקים או מממנים — ונראה לכם איך DPN מתאים לכם."
    button: מתחילים

