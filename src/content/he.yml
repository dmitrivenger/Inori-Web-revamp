      - "באמצעות השותפות האסטרטגית עם Soramitsu אנחנו מביאים סטנדרטים בינלאומיים של אבטחה, פרטיות ויכולת פעולה הדדית — כדי לספק שכבת שירות פיננסית שקופה, מדויקת, רגועה ויעילה."
