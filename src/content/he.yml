    points:
    - DPN עובר ל-INORI רק אחרי ש-INORI בדקה את אסמכתת הבנק וחתמה על ההעברה הספציפית.
    - DPN מסומן כנפרע רק אחרי שאסמכתת התשלום הותאמה ו-INORI אישרה.
    - מפתחות החתימה נוצרים, מוצפנים ומשמשים במכשיר של הלקוח עצמו. אף גורם חיצוני לא מחזיק בהם.
    - רק משתמשים מאומתים ומורשים מטעם החברה יכולים לבצע פעולות בפלטפורמה.
  onboarding:
    eyebrow: איך מתחילים
    title: איך חברה מצטרפת ל-NEVO
    steps:
    - title: פותחים חשבון חברה
      text: מזינים את פרטי רישום החברה וכתובת דוא"ל עסקית של נציג מורשה.
    - title: מאמתים את החברה
      text: מוסיפים פרטים על הנציגים המורשים ועל הבעלים, ומעלים את מסמכי החברה, הבנק והזהות שנבקש.
    - title: שולחים לבדיקה של INORI
      text: אחרי ש-INORI מאשרת את החברה, אפשר להתחיל להוסיף חשבוניות.
    note: חשבון מאושר או חשבונית מאושרת אינם מבטיחים מימון. INORI בודקת כל בקשה ומסכמת איתכם את הסכום, העמלות והתנאים.
  faq:
  - q: מה בעצם עושה הבלוקצ'יין?
    a: SORA Nexus, שמבוססת על Hyperledger Iroha v3, היא הפנקס שבו נרשמים הסטטוס והבעלות של כל DPN. הכסף עצמו, המימון של INORI והתשלום של הקונה, עובר בהעברות בנקאיות רגילות. האסמכתאות נרשמות ומותאמות ב-NEVO.
  - q: האם ספק יכול לבקש פקטורינג ישירות?
    a: כן, אם יש בבעלותו DPN פעיל וזכאי. החברה צריכה לעבור אימות, הצד השני צריך להסכים, ו-INORI בודקת את הבקשה לפני שהיא מעבירה כסף.
  - q: מה קורה אם החשבונית משולמת באיחור או נמצאת במחלוקת?
    a: זה נקבע בהסכמים של אותה עסקה, כולל מי מחזיר את המקדמה ומה קורה בזמן שהמחלוקת מתבררת. כדאי לעבור על התנאים האלה עם INORI לפני שמקבלים מימון.
  - q: מי יכול לראות את פרטי החברה והחשבוניות שלי?
    a: ב-NEVO הגישה מוגבלת למשתמשים מורשים בלבד. כדי לדעת איך INORI מטפלת במידע אישי ובמידע על חברות, עיינו במדיניות הפרטיות או פנו אלינו.
