legal:
  updated: 'עודכן לאחרונה: נובמבר 2026'
  terms:
    title: תנאי שימוש
    sections:
    - h: כללי
      p: אתר זה מופעל על ידי אינורי פיננס בע"מ ("INORI"). השימוש באתר מהווה הסכמה לתנאים אלה. אם אינכם מסכימים להם, אנא הימנעו משימוש באתר.
    - h: מידע בלבד
      p: התוכן באתר מוצג למטרות מידע כללי בלבד. הוא אינו מהווה ייעוץ השקעות, ייעוץ פיננסי, משפטי, מס או אשראי, ואינו מהווה הצעה או שידול לרכישת מוצר פיננסי כלשהו. כל שירות ניתן רק במסגרת הסכם נפרד ובכפוף לדין החל.
    - h: קניין רוחני
      p: כל התוכן באתר, לרבות טקסטים, גרפיקה, סימנים מסחריים ותוכנה, שייך ל-INORI או למעניקי הרישיון שלה, ואין להעתיקו או להשתמש בו ללא אישור מראש ובכתב.
    - h: הגבלת אחריות
      p: INORI עושה מאמצים סבירים כדי שהמידע יהיה מדויק ועדכני, אך אינה מתחייבת לשלמותו או לדיוקו. INORI לא תישא באחריות לכל נזק שייגרם מהשימוש באתר או מהסתמכות על תוכנו.
    - h: קישורים חיצוניים
      p: האתר עשוי לכלול קישורים לאתרים של צדדים שלישיים. INORI אינה אחראית לתוכנם או למדיניות הפרטיות שלהם.
    - h: שינויים
      p: INORI רשאית לעדכן תנאים אלה ואת תוכן האתר בכל עת וללא הודעה מוקדמת.
    - h: דין וסמכות שיפוט
      p: על תנאים אלה יחולו דיני מדינת ישראל. סמכות השיפוט הבלעדית נתונה לבתי המשפט המוסמכים בישראל.
  privacy:
    title: מדיניות פרטיות
    sections:
    - h: מי אנחנו
      p: אינורי פיננס בע"מ, פתח תקווה, אחראית למידע האישי הנאסף באמצעות אתר זה.
    - h: איזה מידע אנחנו אוספים
      p: כאשר אתם פונים אלינו אנו אוספים את הפרטים שמסרתם, כגון שם, חברה, דוא"ל, טלפון ותוכן ההודעה. ייתכן שנאסוף גם מידע טכני בסיסי הדרוש להפעלת האתר.
    - h: איך אנחנו משתמשים במידע
      p: אנו משתמשים בפרטים רק כדי להשיב לפנייתכם, לספק את שירותינו ולעמוד בחובות לפי דין. איננו מוכרים את המידע שלכם.
    - h: העברת מידע
      p: איננו מעבירים את פרטיכם לצדדים שלישיים ללא הסכמתכם, למעט נותני שירות המסייעים לנו בהפעלת האתר, או כאשר הדבר נדרש לפי דין.
    - h: עוגיות
      p: האתר משתמש רק בעוגיות ובאחסון מקומי הנחוצים להפעלתו, כגון שמירת בחירת השפה.
    - h: הזכויות שלכם
      p: אתם רשאים לבקש לעיין במידע האישי שלכם, לתקנו או למחוק אותו בהתאם לחוק הגנת הפרטיות. לשם כך פנו אלינו בכתובת kobis@inori.co.il.
  accessibility:
    title: הצהרת נגישות
    sections:
    - h: המחויבות שלנו
      p: INORI מחויבת להנגשת האתר לכלל המשתמשים, לרבות אנשים עם מוגבלות, בהתאם לתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע"ג-2013.
    - h: רמת הנגישות
      p: האתר תוכנן לעמוד בתקן הישראלי ת"י 5568, המבוסס על הנחיות WCAG 2.0 ברמה AA. האתר תומך בניווט באמצעות מקלדת, בקוראי מסך, בהגדלת טקסט, בניגודיות צבעים מספקת ובטקסט חלופי לתמונות.
    - h: הסתייגויות
      p: למרות מאמצינו, ייתכן שחלק מהתכנים, כגון סרטונים של צדדים שלישיים או מסמכים חיצוניים, עדיין אינם נגישים במלואם. אנו פועלים לשיפור מתמיד.
    - h: פנייה לרכז הנגישות
      p: אם נתקלתם בבעיית נגישות, פנו אלינו בדוא"ל kobis@inori.co.il או בטלפון 054-592-0898 ונעשה כל שביכולתנו לטפל בה בהקדם.
  regulatory:
    title: מידע רגולטורי
    sections:
    - h: רישוי
      p: אינורי פיננס בע"מ פועלת באישור רשות שוק ההון, ביטוח וחיסכון, ברישיונות מס' 70208 ו-70210.
    - h: מהות המידע
      p: המידע באתר הוא כללי ואינו תחליף לייעוץ המתחשב בנסיבותיכם הספציפיות. השירותים ניתנים רק במסגרת הסכם ובכפוף לרגולציה החלה.
    - h: פניות ותלונות
      p: ניתן לשלוח פניות ותלונות לכתובת kobis@inori.co.il.
notfound:
  title: הדף לא נמצא
  text: הדף שחיפשתם אינו קיים או שהועבר.
