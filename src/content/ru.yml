  terms:
    title: Условия использования
    sections:
    - h: Общие положения
      p: Сайт принадлежит компании INORI Finance Ltd. («INORI»). Используя сайт, вы соглашаетесь с настоящими условиями. Если вы с ними не согласны, пожалуйста, не используйте сайт.
