home:
  title: "INORI Finance — цифровые платёжные векселя для расчётов с поставщиками"
  description: "Платформа DPN от INORI превращает обязательства по оплате поставщикам в цифровые платёжные векселя на блокчейне: поставщики получают деньги раньше, а финансирующие организации инвестируют в проверенную дебиторскую задолженность."
  hero:
    eyebrow: Лицензированный финтех · Израиль
    title: "Платежи поставщикам, превращённые в ликвидность."
    subtitle: "Платформа цифровых платёжных векселей (DPN) превращает одобренные платежи поставщикам в цифровые векселя на блокчейне: поставщики получают оплату раньше, плательщики сохраняют свои условия, а финансирующие организации инвестируют в проверенную дебиторскую задолженность."
    cta_primary: Начать
    cta_secondary: Как работает DPN
  trust:
    - Лицензия Управления рынка капитала
    - Официальный партнёр Soramitsu в Израиле
    - На базе Hyperledger Iroha
    - Публикации в Calcalist, TheMarker, Israel Hayom
  problem:
    eyebrow: Проблема
    title: "Поставщики месяцами ждут оплаты."
    text: "Длинные сроки оплаты замораживают оборотный капитал по всей цепочке поставок. Счета ждут в очереди, финансирование медленное и бумажное, а малые поставщики платят за ожидание."
  solution:
    eyebrow: Решение
    title: "Один цифровой вексель. Ликвидность с первого дня."
    text: "С DPN плательщик выпускает цифровой платёжный вексель на одобренный счёт. Поставщик может держать его до погашения или продать финансирующей организации и получить деньги раньше — каждый шаг фиксируется в неизменяемом реестре."
  how:
    eyebrow: Как это работает
    title: "От счёта до досрочной оплаты — четыре шага"
    steps:
      - title: Плательщик выпускает DPN
        text: "Одобренный платёж поставщику выпускается как цифровой платёжный вексель и записывается в блокчейн-реестр."
      - title: Поставщик получает вексель
        text: "Вексель передаётся поставщику с понятной суммой, датой погашения и полной историей операций."
      - title: Досрочная оплата от финансирующей стороны
        text: "Поставщик может продать вексель банку или факторинговой компании и сразу получить деньги. Смена владельца фиксируется в реестре."
      - title: Погашение в срок
        text: "В дату погашения плательщик платит текущему держателю векселя. Вся история остаётся проверяемой."
  audiences:
    eyebrow: Для кого
    title: "Одна платформа — три стороны каждого платежа"
    items:
      - key: payers
        title: Плательщики
        subtitle: Корпорации и государственные структуры
        text: "Поддерживайте поставщиков, не меняя свои условия оплаты, с полной прозрачностью по каждому обязательству."
      - key: suppliers
        title: Поставщики
        subtitle: Малый и средний бизнес, подрядчики
        text: "Превращайте одобренные платежи в деньги, когда они нужны, а не ждите наступления срока оплаты."
      - key: funders
        title: Финансирующие организации
        subtitle: Банки и факторинговые компании
        text: "Доступ к потоку проверенной дебиторской задолженности, обеспеченной обязательствами плательщика, с прозрачной историей владения."
  principles:
    eyebrow: Как мы работаем
    title: "Ясность, стабильность и конфиденциальность"
    items:
      - icon: chat
        title: Спокойное и сфокусированное сопровождение
        text: "Работаем за кулисами, в полной координации со всеми сторонами — без шума, с результатом."
      - icon: ledger
        title: Системное мышление
        text: "Анализируем сложность, разбираемся в регуляторной структуре и строим решение под задачу."
      - icon: invoice
        title: Исполнение, а не только советы
        text: "Готовим документы, ведём процессы и следим, чтобы дело двигалось — на каждом этапе."
      - icon: shield
        title: Полное соответствие регулированию
        text: "Работаем в рамках закона и находим гибкие решения внутри правил."
  services:
    eyebrow: Услуги
    title: "Экспертиза вокруг платформы"
    text: "Помимо DPN, наша команда сопровождает организации в лицензировании, построении платёжных процессов и внедрении."
  press:
    eyebrow: Пресса
    title: "Что о нас пишут"
  faq:
    eyebrow: Вопросы и ответы
    title: Частые вопросы
    items:
      - q: Что такое цифровой платёжный вексель (DPN)?
        a: "DPN — это цифровая запись обязательства плательщика заплатить поставщику определённую сумму в определённую дату. Он выпускается и учитывается в блокчейн-реестре, поэтому владение и история всегда проверяемы."
      - q: Как поставщик получает оплату досрочно?
        a: "Получив DPN, поставщик может продать вексель финансирующей организации — участнику платформы — и получить оплату до наступления срока. В дату погашения плательщик платит финансирующей стороне."
      - q: Нужно ли плательщику менять условия оплаты?
        a: "Нет. Плательщик сохраняет текущие условия и платит в изначальный срок — тому, кто в этот момент держит вексель."
      - q: Что происходит после того, как я оставлю контакты?
        a: "Мы договоримся о коротком бесплатном и ни к чему не обязывающем звонке, чтобы понять ваши задачи и предложить следующие шаги."
      - q: Моё обращение конфиденциально?
        a: "Да. Все обращения рассматриваются строго конфиденциально, и никакая информация не передаётся третьим лицам без вашего явного согласия."
  cta:
    title: "Готовы высвободить ликвидность в своей цепочке поставок?"
    text: "Расскажите, кто вы — плательщик, поставщик или финансирующая организация, — и мы покажем, как вам подойдёт DPN."
    button: Начать

dpn:
  title: "Платформа DPN — цифровые платёжные векселя на блокчейне | INORI"
  description: "Платформа DPN выпускает, передаёт и погашает цифровые платёжные векселя в блокчейн-реестре и делает факторинг для поставщиков полностью прозрачным."
  hero:
    eyebrow: Платформа
    title: "Цифровые платёжные векселя в реестре, которому можно доверять."
    subtitle: "Факторинговая платформа на блокчейне, которая превращает одобренные платежи поставщикам в передаваемые цифровые векселя."
  what:
    eyebrow: Что такое DPN
    title: "Обещание платежа — цифровое и передаваемое"
    paragraphs:
      - "Цифровой платёжный вексель — это обязательство плательщика выплатить поставщику одобренную сумму в установленную дату. Вместо бумажного векселя или счёта, ожидающего в очереди, он выпускается как цифровой актив в разрешённом (permissioned) блокчейн-реестре."
      - "Поскольку вексель можно передавать, поставщик может продать его финансирующей организации и получить деньги раньше. Каждый выпуск, передача и погашение фиксируются — у всех сторон появляется единый проверяемый источник правды."
  platform:
    eyebrow: Внутри платформы
    title: "Создана для плательщиков, поставщиков и финансирующих организаций"
    text: "У каждого участника — своё рабочее пространство для выпуска, получения, продажи и погашения векселей."
  benefits:
    eyebrow: Почему DPN
    items:
      - icon: clock
        title: Быстрая ликвидность
        text: "Поставщики превращают одобренные платежи в деньги, не дожидаясь срока оплаты."
      - icon: ledger
        title: Единый источник правды
        text: "Выпуск, владение и погашение записываются в общий неизменяемый реестр."
      - icon: search
        title: Полная прозрачность
        text: "Плательщики, поставщики и финансирующие стороны видят один и тот же проверенный статус каждого векселя."
      - icon: scales
        title: Регулируемая среда
        text: "Оператор — компания с лицензией Управления рынка капитала Израиля."
  security:
    eyebrow: Безопасность и соответствие
    title: "Неизменяемые записи. Подтверждённое владение."
    text: "DPN работает на Hyperledger Iroha — корпоративном блокчейне с контролем доступа. Проводить операции могут только авторизованные участники, а каждая смена владельца записывается навсегда."
    points:
      - Сеть с контролем доступа и идентифицированными участниками
      - Неизменяемая история каждого векселя
      - Понятный владелец в любой момент
      - Поддержка регуляторных и аудиторских требований
  video:
    title: "DPN в действии"
    text: "Короткий обзор того, как цифровой платёжный вексель проходит путь от плательщика к поставщику и финансирующей стороне."

solutions:
  payers:
    title: "DPN для плательщиков — корпорации и госструктуры | INORI"
    description: "Дайте поставщикам досрочную оплату, сохранив свои условия и полную прозрачность."
    hero:
      eyebrow: Плательщикам
      title: "Укрепляйте цепочку поставок, не меняя условий."
      subtitle: "Корпорации и государственные структуры используют DPN, чтобы дать поставщикам доступ к досрочной оплате — и при этом платить в изначальный срок."
    intro: "Длинные сроки оплаты защищают ваш денежный поток, но давят на поставщиков. DPN позволяет совместить и то и другое: вы выпускаете цифровой вексель на каждый одобренный платёж, а поставщик сам решает, когда превратить его в деньги."
    benefits:
      - icon: tower
        title: Ваши условия оплаты сохраняются
        text: "Вы платите в согласованный срок — текущему держателю векселя."
      - icon: search
        title: Полная прозрачность
        text: "Все выпущенные векселя, их держатели и статусы — в одном месте."
      - icon: supplier
        title: Более устойчивые поставщики
        text: "Поставщики с доступом к ликвидности — более стабильные и надёжные партнёры."
      - icon: invoice
        title: Меньше бумаг
        text: "Ручные подтверждения и бумажные векселя заменяет цифровой процесс с полной историей."
    flow_title: "Ваша роль в процессе"
    flow:
      - "Одобряете счёт поставщика как обычно."
      - "Выпускаете DPN на одобренную сумму и срок."
      - "Платите держателю векселя в дату погашения."
  suppliers:
    title: "DPN для поставщиков — досрочная оплата | INORI"
    description: "Превращайте одобренные платежи в деньги, когда они нужны, вместо многомесячного ожидания."
    hero:
      eyebrow: Поставщикам
      title: "Одобренные платежи — доступны, когда они вам нужны."
      subtitle: "Получите цифровой платёжный вексель от заказчика и выберите: держать до погашения или продать и получить деньги раньше."
    intro: "Ожидание оплаты 60, 90 или 120 дней тормозит рост. С DPN одобренный платёж становится цифровым векселем, который можно превратить в деньги — под обязательство заказчика, а не под ваш собственный баланс."
    benefits:
      - icon: clock
        title: Оплата раньше срока
        text: "Продайте вексель финансирующей организации и получите деньги до наступления срока."
      - icon: note
        title: Понятно и проверяемо
        text: "Сумма, срок и плательщик записаны в реестре — никаких споров о том, что было одобрено."
      - icon: chart
        title: Планируйте рост
        text: "Предсказуемый денежный поток позволяет брать новые заказы и проекты."
      - icon: exchange
        title: Решаете вы
        text: "По каждому векселю вы сами решаете — ждать или получить оплату досрочно."
    flow_title: "Ваша роль в процессе"
    flow:
      - "Поставляете товар или услугу и выставляете счёт как обычно."
      - "Получаете DPN после одобрения платежа."
      - "Держите вексель или продаёте его для досрочной оплаты."
  funders:
    title: "DPN для финансирующих организаций — банки и факторинг | INORI"
    description: "Инвестируйте в проверенную дебиторскую задолженность, обеспеченную обязательствами плательщика, с прозрачной историей владения."
    hero:
      eyebrow: Финансирующим организациям
      title: "Проверенная дебиторская задолженность с видимой историей владения."
      subtitle: "Банки и факторинговые компании используют DPN для финансирования платежей поставщикам под одобренные обязательства плательщиков."
    intro: "Классический факторинг опирается на документы, которые трудно проверить и легко продублировать. DPN даёт векселя, выпуск, владение и погашение которых записаны в общем реестре, — это снижает операционный риск и затраты на проверку."
    benefits:
      - icon: vault
        title: Активы под обязательства плательщика
        text: "Каждый вексель — это одобренное обязательство идентифицированного плательщика."
      - icon: ledger
        title: Без двойного финансирования
        text: "Единственная запись в реестре исключает повторную продажу векселя."
      - icon: search
        title: Быстрая проверка
        text: "Сумма, плательщик, срок и история владения проверяются мгновенно."
      - icon: chart
        title: Масштабируемый поток сделок
        text: "Доступ к векселям множества поставщиков через одну платформу."
    flow_title: "Ваша роль в процессе"
    flow:
      - "Изучаете доступные векселя и плательщиков."
      - "Покупаете векселя и платите поставщикам досрочно."
      - "Получаете оплату от плательщика в дату погашения."

services:
