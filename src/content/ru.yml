    sections:
    - h: Лицензии
      p: INORI Finance Ltd. работает с одобрения Управления рынка капитала Израиля по лицензиям № 70208 и 70210.
    - h: Характер информации
      p: Информация на сайте носит общий характер и не заменяет консультацию с учётом ваших обстоятельств. Услуги оказываются только по договору и в соответствии с применимым регулированием.
    - h: Обращения и жалобы
