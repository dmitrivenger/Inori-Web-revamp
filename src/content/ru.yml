  hero:
    eyebrow: Технология
    title: "Корпоративный блокчейн, созданный для финансов."
    subtitle: "DPN работает на Hyperledger Iroha — распределённом реестре с контролем доступа, созданном для регулируемой финансовой инфраструктуры."
  ledger:
    eyebrow: Реестр
    title: "Зачем распределённый реестр?"
    text: "Факторинг держится на доверии: что платёж одобрен, что вексель существует в единственном экземпляре и что владелец — тот, за кого себя выдаёт. Общий реестр даёт каждому участнику одну и ту же проверенную запись — без писем, таблиц и бумаги."
    points:
      - icon: ledger
        title: Общая запись
        text: "Все авторизованные стороны видят одно и то же состояние каждого векселя."
      - icon: shield
        title: Неизменяемость
        text: "Историю нельзя изменить задним числом."
      - icon: exchange
        title: Мгновенная передача
        text: "Владение переходит между сторонами за один зафиксированный шаг."
  iroha:
    title: Hyperledger Iroha
    text: "Блокчейн с открытым кодом и контролем доступа в рамках проекта Hyperledger фонда Linux Foundation, созданный для цифровых активов, идентификации и платёжных систем в регулируемой среде."
  partnership:
    eyebrow: Стратегическое партнёрство
    title: "В партнёрстве с Soramitsu"
    text: "INORI — официальный партнёр Soramitsu в Израиле. Soramitsu — один из ведущих разработчиков финансовой инфраструктуры на блокчейне и систем цифровых валют центральных банков, а также один из основных разработчиков Hyperledger Iroha. Партнёрство приносит на израильский рынок проверенные технологии и международные стандарты безопасности, конфиденциальности и совместимости."

about:
  title: "О компании INORI Finance"
  description: "INORI — лицензированная израильская финтех-компания, создающая платёжную инфраструктуру на блокчейне в партнёрстве с Soramitsu."
  hero:
    eyebrow: О компании
    title: "Новое финансовое видение."
    subtitle: "Финансы — это сервис, и в центре — конечный пользователь."
  story:
    title: Кто мы
    paragraphs:
      - "INORI — стратегическая и технологическая команда, специализирующаяся на цифровой платёжной инфраструктуре, финансовом регулировании и применении блокчейна. Мы оказываем финансовые и регуляторные услуги государственным структурам, институтам и бизнесу и создаём платформу DPN для расчётов с поставщиками."
      - "В нашей команде — консультанты с финансовым, юридическим и регуляторным опытом, юристы, специализирующиеся на цифровых активах и регулировании платежей, и технологи с опытом проектов на распределённых реестрах на Hyperledger Iroha."
      - "Благодаря стратегическому партнёрству с Soramitsu мы применяем международные стандарты безопасности, конфиденциальности и совместимости, чтобы создать прозрачный, точный, спокойный и эффективный финансовый сервис."
