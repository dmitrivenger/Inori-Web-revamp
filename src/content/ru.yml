    - NEVO выпускает DPN на поставщика.
    - В срок платите владельцу DPN по инструкции.
  suppliers:
    title: NEVO для поставщиков | INORI Finance
    description: Запрашивайте досрочную оплату по счетам, которые подтвердил покупатель, или дождитесь срока. Решать вам.
    hero:
