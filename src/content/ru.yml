home:
  title: INORI Finance | NEVO, обратный факторинг с цифровыми платёжными векселями
  description: NEVO от INORI Finance превращает счёт, подтверждённый покупателем, в цифровой платёжный вексель (DPN). Поставщик может попросить INORI заплатить раньше, а покупатель по-прежнему платит в изначальный срок.
  hero:
    eyebrow: NEVO от INORI Finance
    title: Поставщики получают деньги раньше. Покупатели платят в срок.
    subtitle: Всё начинается со счёта, который покупатель уже подтвердил. Вы можете попросить INORI заплатить вам раньше, а покупатель заплатит в ту дату, о которой вы договорились.
    cta_primary: Связаться с INORI
    cta_secondary: Как это работает
  trust:
  - Работает с одобрения Управления рынка капитала, лицензии 70208 и 70210
  - Представитель Soramitsu в Израиле
  - Работает на SORA Nexus и Hyperledger Iroha v3
  - Публикации в Calcalist, TheMarker и Israel Hayom
  problem:
    eyebrow: Разрыв
    title: Работа сделана. А деньги всё ещё в пути.
    text: Поставщики часто заканчивают работу за несколько месяцев до того, как им за неё заплатят. Пока не наступит срок оплаты, уже заработанные деньги просто стоят в чужой очереди платежей.
  solution:
    eyebrow: Наш подход
    title: Как только покупатель подтверждает счёт, он становится понятным обязательством.
    text: NEVO превращает подтверждённый счёт в цифровой платёжный вексель (DPN). Поставщик может дождаться срока оплаты или попросить INORI заплатить раньше. Если INORI одобряет заявку и поставщика устраивают условия, INORI переводит деньги, а покупатель всё равно платит в изначальную дату.
  how:
    eyebrow: Как это работает
    title: Обратный факторинг в четыре шага
    steps:
    - title: Покупатель подтверждает счёт
      text: Покупатель подтверждает поставщика, сумму и срок оплаты. NEVO сводит всё это в цифровой платёжный вексель (DPN) и выпускает его на поставщика.
    - title: Поставщик решает
      text: Можно держать DPN до срока оплаты, а можно попросить INORI заплатить раньше. Подтверждённый счёт ещё не означает одобренное финансирование.
    - title: INORI проверяет и платит
      text: INORI рассматривает заявку. Если она одобрена и поставщик принимает условия, INORI платит банковским переводом, проверяет банковское подтверждение, и DPN переходит к INORI.
    - title: Покупатель платит в срок
      text: В изначальную дату покупатель платит тому, кто в этот момент владеет DPN. После сверки платежа DPN получает статус погашенного.
  audiences:
    eyebrow: Для кого
    title: Для обеих сторон одного счёта
    items:
    - key: suppliers
      img: home_audience-suppliers
      url: solutions/suppliers/
      title: Поставщики
      subtitle: Подрядчики и поставщики услуг
      text: Запрашивайте досрочную оплату по счетам, которые подтвердил покупатель. Вы видите условия до того, как соглашаетесь, и всегда можете просто дождаться срока.
    - key: buyers
      img: home_audience-payers
      url: solutions/buyers/
      title: Покупатели
      subtitle: Компании, которые оплачивают счета поставщиков
      text: Помогите поставщикам получать деньги раньше, не сдвигая собственную дату оплаты.
    - key: inori
      img: home_audience-funders
      url: dpn/
      title: INORI
      subtitle: Финансирующая сторона
      text: Мы рассматриваем каждую заявку, платим одобренным поставщикам банковским переводом и получаем оплату от покупателя в срок.
  principles:
    eyebrow: Как мы работаем
    title: Ясность, стабильность и конфиденциальность
    items:
    - icon: chat
      title: Спокойное и точное сопровождение
      text: Работаем за кулисами и держим в курсе всех участников. Без лишнего шума, с результатом.
    - icon: ledger
      title: Видим систему целиком
      text: Разбираемся в деталях, понимаем регуляторную картину и строим подход, который подходит именно вам.
    - icon: invoice
      title: Делаем, а не только советуем
      text: Берём на себя документы, следим за каждым процессом и добиваемся, чтобы дело двигалось.
    - icon: shield
      title: Полностью по правилам
      text: Работаем в рамках закона и находим гибкие решения внутри правил.
  services:
    eyebrow: Услуги
    title: Финансовые и регуляторные услуги
    text: Помимо NEVO, INORI оказывает финансовые и регуляторные услуги государственным структурам, институтам и бизнесу, от стратегии до практической реализации.
  faq:
    eyebrow: Вопросы и ответы
    title: Частые вопросы
    items:
    - q: Что такое обратный факторинг?
      a: Всё начинается с покупателя. Он подтверждает счёт, поставщик может запросить досрочную оплату, а в срок покупатель платит тому, кто в этот момент владеет обязательством. В NEVO это обязательство и право владения им записываются как DPN.
    - q: Покупателю придётся платить раньше?
      a: Нет. Покупатель платит в изначальный срок. Если DPN перешёл к INORI, покупатель просто платит INORI вместо поставщика, на условиях сделки.
    - q: Поставщик обязан брать досрочную оплату?
      a: Вовсе нет. Поставщик может запросить финансирование или просто дождаться срока. Любое финансирование зависит от соответствия критериям, проверки, одобрения и согласованных условий.
    - q: Финансируется ли каждый подтверждённый счёт?
      a: Нет. Подтверждённый счёт и одобренное финансирование не одно и то же. INORI проверяет каждую компанию и каждый счёт, а поставщик видит условия до того, как решить, продолжать ли.
    - q: Что будет после того, как я оставлю контакты?
      a: Мы договоримся о коротком бесплатном звонке без обязательств, чтобы понять ваши задачи и предложить следующие шаги.
    - q: Моё обращение конфиденциально?
      a: Да. Каждое обращение рассматривается строго конфиденциально, и мы никому ничего не передаём без вашего явного согласия.
  cta:
    title: Всё начинается с одного подтверждённого счёта.
    text: Расскажите, вы поставщик или покупатель, и мы покажем, как NEVO работает для вас.
    button: Связаться с INORI
  press:
    eyebrow: Пресса
    title: Что о нас пишут
dpn:
  title: NEVO от INORI Finance | Цифровые платёжные векселя и обратный факторинг
  description: NEVO превращает счёт, подтверждённый покупателем, в цифровой платёжный вексель (DPN). После проверки и на согласованных условиях INORI может заплатить поставщику раньше, а покупатель сохраняет изначальную дату оплаты.
  hero:
    eyebrow: NEVO от INORI Finance
    title: Один подтверждённый счёт. Одна понятная запись о платеже.
    subtitle: NEVO превращает счёт, подтверждённый покупателем, в цифровой платёжный вексель (DPN). После проверки и на согласованных условиях INORI может заплатить поставщику раньше, а покупатель сохраняет изначальную дату оплаты.
  what:
    eyebrow: Что такое DPN
    title: Цифровая запись о платеже, который уже одобрен
    paragraphs:
    - Цифровой платёжный вексель (DPN) создаётся в момент, когда покупатель подтверждает счёт поставщика. В нём одобренный платёж собран в одну запись, которую видят покупатель, поставщик и INORI.
    - У каждого DPN есть серийный номер, юридические названия и регистрационные номера покупателя и поставщика, сумма в шекелях, время выпуска, срок оплаты, текущий владелец и статус.
    states_title: Жизненный цикл DPN
    states:
    - Ожидает подтверждения покупателя
    - Выпускается
    - Активен
    - Ожидает погашения
    - Погашен
    states_note: При споре DPN может получить статус спорного или замороженного, и ничего не происходит, пока спор не разрешён.
  modes:
    eyebrow: Два способа работать с NEVO
    title: По инициативе покупателя или поставщика
    items:
    - icon: tower
      title: Обратный факторинг (инициатор покупатель)
      text: Покупатель подтверждает счёт. Поставщик может запросить досрочную оплату, а в срок покупатель платит тому, кто владеет DPN.
    - icon: supplier
      title: Факторинг (инициатор поставщик)
      text: Поставщик может и сам запросить финансирование под активный DPN, который ему принадлежит и подходит под условия. Другая сторона должна дать согласие, а INORI проверяет заявку до перевода денег.
    - icon: ledger
      title: Одна запись для обеих сторон
      text: Подтверждения, владение, этапы финансирования и подтверждения оплаты хранятся вместе, от первого одобрения до последнего платежа.
  benefits:
    supplier_title: Поставщикам
    supplier:
    - Возможность получить деньги раньше по подтверждённому счёту, после проверки и на согласованных условиях.
    - Вы видите условия и все этапы до того, как на что-то соглашаетесь.
    - Подтверждение, проверка INORI, оплата, переход права и погашение в одном месте.
    - Деньги раньше не нужны? Просто дождитесь срока оплаты.
    buyer_title: Покупателям
    buyer:
    - Помогайте поставщикам получать деньги раньше, не платя самим ни днём раньше.
    - Сумма и срок, которые вы подтвердили, остаются неизменными в общей записи.
    - Подтверждения счетов, согласования, владение и подтверждения оплаты в одном месте.
    - Программа, которую можно повторять с подходящими поставщиками и счетами.
  platform:
    eyebrow: Внутри NEVO
    title: Одно рабочее пространство для покупателей и поставщиков
    text: 'Компании работают в одном портале: подтверждают счета, выпускают DPN, запрашивают факторинг и следят за тем, что должно быть оплачено, что оплачено и что погашено.'
    features:
    - Входящие согласования, с подписью нескольких сотрудников там, где это нужно
    - Двухфакторная аутентификация для важных действий и доступ по ролям
    - Всегда видно, ожидает ли операция, завершена или не прошла
    - Встроенный обозреватель для поиска любого DPN, операции или компании
  security:
    eyebrow: Технология и контроль
    title: Реестр следит за владением. Деньги идут через банки.
    text: SORA Nexus на базе Hyperledger Iroha v3 записывает каждое изменение статуса и владельца DPN. Платежи INORI и покупателя проходят обычными банковскими переводами вне блокчейна, а подтверждения потом записываются и сверяются в NEVO.
    points:
    - DPN переходит к INORI только после того, как INORI проверит банковское подтверждение и подпишет именно эту передачу.
    - DPN получает статус погашенного только после сверки подтверждения оплаты и одобрения INORI.
    - Ключи подписи создаются, шифруются и используются на устройстве самого клиента. Сторонний хранитель их не держит.
    - Действовать на платформе могут только проверенные и уполномоченные сотрудники компании.
  onboarding:
    eyebrow: С чего начать
    title: Как компания подключается к NEVO
    steps:
    - title: Откройте аккаунт компании
      text: Укажите регистрационные данные компании и рабочую почту уполномоченного представителя.
    - title: Подтвердите данные компании
      text: Добавьте сведения об уполномоченных представителях и владельцах и загрузите документы компании, банка и удостоверения личности, которые мы запросим.
    - title: Отправьте на проверку в INORI
      text: Когда INORI одобрит компанию, можно начинать добавлять счета.
    note: Одобренный аккаунт или подтверждённый счёт не гарантируют финансирование. INORI рассматривает каждую заявку и согласует с вами сумму, комиссии и условия.
    eligibility: Сейчас регистрация доступна только израильским компаниям с ограниченной ответственностью (Ltd).
  faq:
  - q: Что на самом деле делает блокчейн?
    a: SORA Nexus на базе Hyperledger Iroha v3 служит реестром, где записываются статус и владелец каждого DPN. Сами деньги, финансирование INORI и оплата покупателя, идут обычными банковскими переводами. Подтверждения затем записываются и сверяются в NEVO.
  - q: Кто может подключиться к NEVO?
    a: Сейчас регистрация открыта только для израильских компаний с ограниченной ответственностью (Ltd). Понадобятся регистрационные и банковские данные компании, рабочая почта уполномоченного представителя, а также документы компании, владельцев и удостоверения личности, которые мы запросим.
  - q: Может ли поставщик запросить факторинг напрямую?
    a: Да, если у него есть активный DPN, который подходит под условия. Компания должна пройти проверку, другая сторона должна дать согласие, а INORI проверяет заявку до перевода денег.
  - q: Что будет, если счёт оплачен с опозданием или по нему спор?
    a: Это определяется соглашениями по конкретной сделке, в том числе кто возвращает аванс и что происходит, пока спор разрешается. Обсудите эти условия с INORI до того, как принять финансирование.
  - q: Кто видит данные моей компании и счетов?
    a: Доступ в NEVO есть только у уполномоченных пользователей. О том, как INORI обрабатывает персональные данные и данные компаний, читайте в политике конфиденциальности или спросите нас напрямую.
  video:
    title: Смотреть видео о DPN
    text: ''
