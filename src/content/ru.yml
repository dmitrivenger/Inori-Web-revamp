    intro: Вы уже сделали работу. NEVO позволяет превратить подтверждённый счёт в понятную заявку на досрочную оплату. Вы видите условия до того, как решите, и можете следить за каждым этапом, пока деньги не придут, а счёт не будет погашен. Финансирование необязательно и зависит от проверки INORI и согласованных условий.
    benefits:
    - icon: clock
      title: Деньги раньше
      text: Запросите финансирование по подтверждённому счёту, после проверки и на согласованных условиях.
    - icon: search
      title: Сначала условия
      text: Вы знаете условия и следующие шаги до того, как на что-то согласитесь.
    - icon: ledger
      title: Всё в одном месте
      text: Следите за подтверждением, проверкой, оплатой, переходом права и погашением.
    - icon: exchange
      title: Решаете вы
      text: Хотите подождать? Держите DPN до срока оплаты.
    flow_title: Что делаете вы
    flow:
    - Добавляете счёт. Когда покупатель его подтвердит, на вас выпускается DPN.
    - 'Выбираете: дождаться срока или попросить INORI заплатить раньше.'
    - Если заявку одобрят и вас устроят условия, INORI переведёт вам деньги.
services:
