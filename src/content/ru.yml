technology:
  title: Технология | SORA Nexus и Hyperledger Iroha v3 | INORI
  description: NEVO записывает статус и владельца каждого DPN в SORA Nexus на базе технологии Hyperledger Iroha v3, разработанной Soramitsu.
  hero:
    eyebrow: Технология
    title: Надёжная технология за каждым платежом.
    subtitle: NEVO записывает статус и владельца каждого DPN в SORA Nexus на базе Hyperledger Iroha v3.
  ledger:
    eyebrow: Что делает реестр
    title: Одна запись, за которой могут следить все
    text: Уполномоченные пользователи видят в одном месте счёт, подтверждения, статус финансирования и инструкции по оплате. Реестр хранит всю историю статусов и владельцев каждого DPN, а сами деньги идут через банки.
    points:
    - icon: ledger
      title: Одно подтверждённое обязательство
      text: Сумма, стороны, их согласие, срок и статус остаются связаны.
    - icon: exchange
      title: Понятная история владения
      text: Каждая передача записывается после того, как INORI проверит банковское подтверждение и подпишет её.
    - icon: shield
      title: Подтверждение оплаты
      text: Подтверждение оплаты сверяется со сделкой, и все, у кого есть доступ, видят, когда она погашена.
  iroha:
    title: SORA Nexus и Hyperledger Iroha v3
    text: 'Hyperledger Iroha это технология распределённого реестра с открытым кодом, в создании которой Soramitsu сыграла ключевую роль. NEVO использует SORA Nexus на базе Iroha v3 как реестр для DPN. Разбираться в блокчейне не нужно: компании просто работают в веб-портале.'
  partnership:
    eyebrow: Стратегическое партнёрство
    title: INORI представляет Soramitsu в Израиле
    text: Soramitsu это японская финтех-компания, основанная в Токио в 2016 году. Она создаёт решения на блокчейне для цифровых активов, цифровой идентификации и финансовой инфраструктуры. Вместе с Национальным банком Камбоджи она разработала и поддерживает Bakong, национальную платёжную систему Камбоджи на блокчейне. INORI представляет Soramitsu в Израиле.
about:
  title: О компании INORI Finance
  description: INORI это израильская финансовая компания, которая управляет платформой обратного факторинга NEVO и представляет Soramitsu в Израиле.
  hero:
    eyebrow: О компании
    title: Новое финансовое видение.
    subtitle: Финансы это сервис, и в центре всегда конечный пользователь.
  story:
    title: Кто мы
    paragraphs:
    - INORI это стратегическая и технологическая команда, которая занимается цифровой платёжной инфраструктурой, финансовым регулированием и применением блокчейна. Мы оказываем финансовые и регуляторные услуги государственным структурам, институтам и бизнесу и управляем NEVO, нашей платформой обратного факторинга для счетов, подтверждённых покупателем.
    - В нашей команде консультанты с финансовым, юридическим и регуляторным опытом, юристы, специализирующиеся на цифровых активах и регулировании платежей, и технологи, работавшие над проектами на распределённых реестрах на Hyperledger Iroha.
    - Благодаря стратегическому партнёрству с Soramitsu мы приносим в Израиль международные стандарты безопасности, конфиденциальности и совместимости, чтобы предлагать прозрачный, точный, спокойный и эффективный финансовый сервис.
