      p: Все материалы сайта, включая тексты, графику, логотипы и программное обеспечение, принадлежат INORI или её лицензиарам и не могут копироваться или использоваться без предварительного письменного разрешения.
    - h: Ограничение ответственности
      p: INORI прилагает разумные усилия для поддержания точности и актуальности информации, но не гарантирует её полноту и точность. INORI не несёт ответственности за ущерб, возникший в результате использования сайта или опоры на его содержание.
    - h: Внешние ссылки
      p: Сайт может содержать ссылки на сайты третьих лиц. INORI не отвечает за их содержание и политику конфиденциальности.
    - h: Изменения
      p: INORI вправе в любое время и без предварительного уведомления изменять настоящие условия и содержание сайта.
    - h: Применимое право
      p: Настоящие условия регулируются законодательством Государства Израиль. Исключительная юрисдикция принадлежит компетентным судам Израиля.
  privacy:
    title: Политика конфиденциальности
    sections:
    - h: Кто мы
      p: INORI Finance Ltd., Петах-Тиква, Израиль, отвечает за персональные данные, собираемые через этот сайт.
    - h: Какие данные мы собираем
      p: 'Когда вы обращаетесь к нам, мы получаем данные, которые вы указываете: имя, компанию, e-mail, телефон и текст сообщения. Мы также можем собирать базовую техническую информацию, необходимую для работы сайта.'
    - h: Как мы их используем
      p: Мы используем ваши данные только для ответа на обращение, оказания услуг и выполнения требований закона. Мы не продаём ваши данные.
    - h: Передача данных
      p: Мы не передаём ваши данные третьим лицам без вашего согласия, за исключением поставщиков услуг, помогающих обеспечивать работу сайта, или случаев, предусмотренных законом.
    - h: Cookies
      p: Сайт использует только файлы cookie и локальное хранилище, необходимые для его работы, например, для запоминания выбранного языка.
    - h: Ваши права
      p: Вы можете запросить доступ к своим персональным данным, их исправление или удаление в соответствии с израильским Законом о защите частной жизни. Для этого напишите нам на kobis@inori.co.il.
  accessibility:
    title: Заявление о доступности
    sections:
    - h: Наши обязательства
      p: INORI стремится сделать сайт доступным для всех пользователей, включая людей с ограниченными возможностями, в соответствии с израильскими Правилами о равных правах людей с ограниченными возможностями (адаптация услуг), 2013.
    - h: Уровень доступности
      p: Сайт разработан в соответствии с израильским стандартом SI 5568, основанным на WCAG 2.0 уровня AA. Поддерживаются навигация с клавиатуры, экранные дикторы, увеличение текста, достаточная контрастность и альтернативный текст для изображений.
    - h: Ограничения
      p: Несмотря на наши усилия, некоторые материалы, например видео третьих лиц или внешние документы, пока могут быть доступны не полностью. Мы постоянно работаем над улучшением.
    - h: Связь с координатором по доступности
      p: Если вы столкнулись с проблемой доступности, напишите на kobis@inori.co.il или позвоните по номеру 054-592-0898, и мы постараемся быстро её решить.
