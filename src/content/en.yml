home:
  title: INORI Finance | NEVO, reverse factoring with Digital Payment Notes
  description: NEVO by INORI Finance turns a buyer-approved invoice into a Digital Payment Note (DPN). Suppliers can ask INORI for early payment, and the buyer still pays on the original due date.
  hero:
    eyebrow: NEVO by INORI Finance
    title: Suppliers get paid sooner. Buyers pay on schedule.
    subtitle: It all starts with an invoice your buyer has already approved. You can ask INORI to pay you early, and your buyer still pays on the date you agreed.
    cta_primary: Talk to INORI
    cta_secondary: See how it works
  trust:
  - Operating with the approval of the Capital Market Authority, licences 70208 and 70210
  - Soramitsu's representative in Israel
  - Runs on SORA Nexus with Hyperledger Iroha v3
  - Featured in Calcalist, TheMarker and Israel Hayom
  problem:
    eyebrow: The gap
    title: The work is done. The money is still on its way.
    text: Suppliers often finish a job months before they get paid. Until the due date comes around, the money they've already earned just sits in someone else's payment queue.
  solution:
    eyebrow: Our approach
    title: Once the buyer approves the invoice, it becomes a clear obligation.
    text: NEVO turns that approved invoice into a Digital Payment Note (DPN). The supplier can wait for the due date, or ask INORI to pay early. If INORI approves and the supplier is happy with the terms, INORI transfers the money, and the buyer still pays on the original date.
  how:
    eyebrow: How it works
    title: Reverse factoring in four steps
    steps:
    - title: The buyer approves the invoice
      text: The buyer confirms who the supplier is, the amount and the due date. NEVO records all of it in a Digital Payment Note (DPN) and issues it to the supplier.
    - title: The supplier decides
      text: Keep the DPN until the due date, or ask INORI for early payment. An approved invoice doesn't automatically mean approved funding.
    - title: INORI reviews and pays
      text: INORI looks at the request. If it's approved and the supplier accepts the terms, INORI pays by bank transfer, checks the bank evidence, and the DPN is transferred to INORI.
    - title: The buyer pays on the due date
      text: On the original due date, the buyer pays whoever owns the DPN at that point. Once the payment is matched, the DPN is marked as settled.
  audiences:
    eyebrow: Who it's for
    title: Built around both sides of the invoice
    items:
    - key: suppliers
      img: home_audience-suppliers
      url: solutions/suppliers/
      title: Suppliers
      subtitle: Service providers and vendors
      text: Ask for early payment on invoices your buyer has approved. You see the terms before you commit, and waiting for the due date is always an option.
    - key: buyers
      img: home_audience-payers
      url: solutions/buyers/
      title: Buyers
      subtitle: Companies that pay supplier invoices
      text: Help your suppliers get paid sooner without moving your own payment date.
    - key: inori
      img: home_audience-funders
      url: dpn/
      title: INORI
      subtitle: The funder
      text: We review each request, pay approved suppliers by bank transfer, and collect from the buyer on the due date.
  principles:
    eyebrow: How we work
    title: Clarity, stability and discretion
    items:
    - icon: chat
      title: Calm, focused guidance
      text: We work behind the scenes and stay coordinated with everyone involved. No noise, just results.
    - icon: ledger
      title: Seeing the whole system
      text: We dig into the details, work out the regulatory picture and build an approach that fits.
    - icon: invoice
      title: We do the work, not just advise
      text: We handle the paperwork, keep track of every process and make sure things keep moving.
    - icon: shield
      title: Fully compliant
      text: We stay within the law and find flexible solutions inside the rules.
  services:
    eyebrow: Services
    title: Financial and regulatory services
    text: Beyond NEVO, INORI offers tailored financial and regulatory services to government bodies, institutions and businesses, from strategy all the way to execution.
  faq:
    eyebrow: FAQ
    title: Questions we hear often
    items:
    - q: What is reverse factoring?
      a: It starts with the buyer. The buyer approves the invoice, the supplier can ask for early payment, and on the due date the buyer pays whoever owns the payment at that point. In NEVO, that obligation and its ownership are recorded as a DPN.
    - q: Does the buyer have to pay earlier?
      a: No. The buyer pays on the original due date. If the DPN has been transferred to INORI, the buyer simply pays INORI instead of the supplier, under the terms of the transaction.
    - q: Does the supplier have to take early payment?
      a: Not at all. The supplier can ask for funding or just wait for the due date. Any funding depends on eligibility, review, approval and the agreed terms.
    - q: Is every approved invoice funded?
      a: No. An approved invoice is not the same as approved funding. INORI reviews every company and every invoice, and the supplier sees the terms before deciding whether to go ahead.
    - q: What happens after I leave my details?
      a: We'll set up a short, free call with no obligation, to understand what you need and suggest the next steps.
    - q: Is my inquiry confidential?
      a: Yes. Every inquiry is handled in full confidence, and we never share anything with anyone without your explicit consent.
  cta:
    title: It starts with one approved invoice.
    text: Tell us if you're a supplier or a buyer, and we'll show you how NEVO works for you.
    button: Talk to INORI
  press:
    eyebrow: In the press
    title: What they say about us
dpn:
  title: NEVO by INORI Finance | Digital Payment Notes and reverse factoring
  description: NEVO turns a buyer-approved invoice into a Digital Payment Note (DPN). After review and agreed terms, INORI can pay the supplier early while the buyer keeps the original payment date.
  hero:
    eyebrow: NEVO by INORI Finance
    title: One approved invoice. One clear payment record.
    subtitle: NEVO turns a buyer-approved invoice into a Digital Payment Note (DPN). After review and agreed terms, INORI can pay the supplier early, and the buyer keeps the original payment date.
  what:
    eyebrow: What is a DPN
    title: A digital record of a payment that's been approved
    paragraphs:
    - A Digital Payment Note (DPN) is created the moment a buyer approves a supplier's invoice. It holds the approved payment in a single record that the buyer, the supplier and INORI all see.
    - Every DPN has a serial number, the legal names and registration numbers of the buyer and supplier, the amount in shekels, when it was issued, the due date, who owns it right now and what state it's in.
    states_title: The life of a DPN
    states:
    - Awaiting buyer approval
    - Issuance pending
    - Active
    - Pending settlement
    - Settled
    states_note: If there's a dispute, the DPN can be marked as disputed or frozen, and nothing moves forward until it's resolved.
  modes:
    eyebrow: Two ways to use NEVO
    title: Led by the buyer, or started by the supplier
    items:
    - icon: tower
      title: Reverse factoring (buyer-led)
      text: The buyer approves the invoice. The supplier can ask for early payment, and on the due date the buyer pays whoever owns the DPN.
    - icon: supplier
      title: Factoring (supplier-led)
      text: A supplier can also ask for funding against an eligible, active DPN it owns. The other party has to agree, and INORI reviews the request before any money is sent.
    - icon: ledger
      title: One record for both sides
      text: Approvals, ownership, funding steps and proof of payment all stay together, from the first approval to the final payment.
  benefits:
    supplier_title: For suppliers
    supplier:
    - The option to get paid sooner on an approved invoice, after review and agreed terms.
    - You see the terms and every step before you accept anything.
    - Follow the approval, INORI's review, the payment, the ownership transfer and settlement in one place.
    - Don't need the money early? Just wait for the due date.
    buyer_title: For buyers
    buyer:
    - Help suppliers get paid sooner without paying any earlier yourself.
    - The amount and due date you approved stay fixed in a shared record.
    - Invoice approvals, sign-offs, ownership and proof of payment, all in one place.
    - A program you can repeat with the suppliers and invoices that qualify.
  platform:
    eyebrow: Inside NEVO
    title: One workspace for buyers and suppliers
    text: Companies use a single portal to approve invoices, issue DPNs, ask for factoring and keep track of what's owed, what's been paid and what's settled.
    features:
    - An approvals inbox, with sign-off from more than one person where needed
    - Two-factor authentication for sensitive actions, plus role-based access
    - You always see whether a transaction is pending, final or failed
    - A built-in explorer to look up any DPN, transaction or company
  security:
    eyebrow: Technology and controls
    title: The ledger tracks ownership. The money moves through banks.
    text: SORA Nexus, built on Hyperledger Iroha v3, records every change in a DPN's state and ownership. INORI's payments and the buyer's payment go through regular bank transfers outside the blockchain, and the proof is then recorded and matched in NEVO.
    points:
    - A DPN moves to INORI only after INORI has checked the bank evidence and signed that specific transfer.
    - A DPN is marked as settled only after the payment proof is matched and INORI approves it.
    - Signing keys are created, encrypted and used on the customer's own device. No outside custodian holds them.
    - Only verified, authorised company users can take actions on the platform.
  onboarding:
    eyebrow: Getting started
    title: How a company joins NEVO
    steps:
    - title: Open a company account
      text: Enter your company's registration details and the work e-mail of an authorised representative.
    - title: Verify the company
      text: Add details of your authorised representatives and owners, and upload the company, bank and ID documents we ask for.
    - title: Send it to INORI for review
      text: Once INORI approves your company, you can start adding invoices.
    note: An approved account or an approved invoice doesn't guarantee funding. INORI looks at every request and agrees the amount, fees and terms with you.
    eligibility: Registration is currently open to Israeli limited companies (Ltd) only.
  faq:
  - q: What does the blockchain actually do?
    a: SORA Nexus, built on Hyperledger Iroha v3, is the ledger where each DPN's state and ownership are recorded. The money itself, INORI's funding and the buyer's payment, moves through regular bank transfers. The proof is then recorded and matched in NEVO.
  - q: Who can join NEVO?
    a: Right now, registration is open to Israeli limited companies (Ltd) only. You'll need your company registration and bank details, the work e-mail of an authorised representative, and the company, ownership and ID documents we ask for.
  - q: Can a supplier ask for factoring directly?
    a: Yes, if it owns an eligible, active DPN. The company needs to be verified, the other party has to agree, and INORI reviews the request before sending any money.
  - q: What if an invoice is paid late or disputed?
    a: That's covered by the agreements for that specific transaction, including who repays the advance and what happens while the dispute is sorted out. Go over these terms with INORI before you accept funding.
  - q: Who can see my company and invoice details?
    a: Only authorised users have access in NEVO. To learn how INORI handles personal and company information, see our privacy policy or get in touch.
