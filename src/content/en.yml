technology:
  title: Technology | SORA Nexus and Hyperledger Iroha v3 | INORI
  description: NEVO records DPN state and ownership on SORA Nexus, built on Hyperledger Iroha v3 technology developed by Soramitsu.
  hero:
    eyebrow: Technology
    title: Solid technology behind every payment.
    subtitle: NEVO records the state and ownership of every DPN on SORA Nexus, built on Hyperledger Iroha v3.
  ledger:
    eyebrow: What the ledger does
    title: One record everyone can follow
    text: Authorised users can follow the invoice, approvals, funding status and payment instructions in one place. The ledger keeps the full history of each DPN's state and ownership, while the money itself moves through banks.
    points:
    - icon: ledger
      title: One approved obligation
      text: The amount, the parties, their consent, the due date and the status stay linked together.
    - icon: exchange
      title: A clear ownership history
      text: Each transfer is recorded once INORI has checked the bank evidence and signed it.
    - icon: shield
      title: Proof of payment
      text: Payment proof is matched to the transaction, so everyone with access can see when it's settled.
  iroha:
    title: SORA Nexus and Hyperledger Iroha v3
    text: 'Hyperledger Iroha is open-source distributed ledger technology, and Soramitsu has played a central role in building it. NEVO uses SORA Nexus, built on Iroha v3, as the ledger for DPNs. You never have to deal with the blockchain directly: companies simply work in a web portal.'
  partnership:
    eyebrow: Strategic partnership
    title: INORI represents Soramitsu in Israel
    text: Soramitsu is a Japanese fintech company, founded in Tokyo in 2016, that builds blockchain-based solutions for digital assets, digital identity and financial infrastructure. Together with the National Bank of Cambodia, it developed and runs Bakong, Cambodia's national blockchain-based payment system. INORI represents Soramitsu in Israel.
about:
  title: About INORI Finance
  description: INORI is an Israeli financial services company. We run NEVO, a reverse factoring platform, and represent Soramitsu in Israel.
  hero:
    eyebrow: About us
    title: A new financial vision.
    subtitle: Finance is a service, and the end user is at the centre.
  story:
    title: Who we are
    paragraphs:
    - INORI is a strategy and technology team working on digital payment infrastructure, financial regulation and blockchain applications. We provide tailored financial and regulatory services to government bodies, institutions and businesses, and we run NEVO, our reverse factoring platform for buyer-approved invoices.
    - Our team includes advisors with financial, legal and regulatory backgrounds, lawyers who specialise in digital assets and payment regulation, and technologists who have worked on distributed ledger projects built on Hyperledger Iroha.
    - Through our strategic partnership with Soramitsu, we bring international standards of security, privacy and interoperability to Israel, so we can offer a financial service that is transparent, precise, calm and efficient.
