home:
  title: "INORI Finance — Digital Payment Notes for supplier payments"
  description: "INORI's DPN platform turns supplier payment obligations into digital payment notes on a blockchain ledger — so suppliers can get paid early and funders can invest in verified receivables."
  hero:
    eyebrow: Licensed fintech · Israel
    title: "Supplier payments, transformed into liquidity."
    subtitle: "The Digital Payment Note (DPN) platform turns approved supplier payments into digital notes on a blockchain ledger — so suppliers get paid early, payers keep their terms, and funders invest in verified receivables."
    cta_primary: Get started
    cta_secondary: How DPN works
  trust:
    - Licensed by the Capital Market Authority
    - Official Israeli partner of Soramitsu
    - Built on Hyperledger Iroha
    - Featured in Calcalist, TheMarker, Israel Hayom
  problem:
    eyebrow: The problem
    title: "Suppliers wait months to get paid."
    text: "Long payment terms tie up working capital across the supply chain. Invoices sit in queues, financing is slow and paper-heavy, and small suppliers carry the cost of waiting."
  solution:
    eyebrow: The solution
    title: "One digital note. Liquidity on day one."
    text: "With DPN, the payer issues a digital payment note for an approved invoice. The supplier can hold it to maturity or sell it to a funder for early payment — with every step recorded on a tamper-proof ledger."
  how:
    eyebrow: How it works
    title: "From invoice to early payment in four steps"
    steps:
      - title: The payer issues a DPN
        text: "An approved supplier payment is issued as a digital payment note and recorded on the blockchain ledger."
      - title: The supplier receives it
        text: "The note is transferred to the supplier with a clear amount, maturity date and full audit trail."
      - title: Early payment from a funder
        text: "The supplier can sell the note to a bank or factoring company and receive cash immediately. The change of ownership is recorded on the ledger."
      - title: Settlement at maturity
        text: "On the due date the payer pays the current holder of the note. The full history stays verifiable."
  audiences:
    eyebrow: Who it's for
    title: "One platform, three sides of every payment"
    items:
      - key: payers
        title: Payers
        subtitle: Corporates & public bodies
        text: "Support your suppliers without changing your payment terms, with full visibility of every obligation."
      - key: suppliers
        title: Suppliers
        subtitle: SMEs and service providers
        text: "Turn approved payments into cash when you need it, instead of waiting until the due date."
      - key: funders
        title: Funders
        subtitle: Banks & factoring companies
        text: "Access a stream of verified, payer-backed receivables with transparent ownership and history."
  principles:
    eyebrow: How we work
    title: "Clarity, stability and discretion"
    items:
      - icon: chat
        title: Calm and focused guidance
        text: "We work behind the scenes, in full coordination with all parties — without noise, with results."
      - icon: ledger
        title: Systemic thinking
        text: "We analyse the complexity, map the regulatory structure and build a tailored approach."
      - icon: invoice
        title: Execution, not just advice
        text: "We handle documents, follow processes and make sure things actually move — at every stage."
      - icon: shield
        title: Full regulatory compliance
        text: "We work within legal requirements and find flexible solutions inside the rules."
  services:
    eyebrow: Services
    title: "Expertise around the platform"
    text: "Beyond DPN, our team supports institutions with licensing, payment-process design and implementation."
  press:
    eyebrow: In the press
    title: "What they say about us"
  faq:
    eyebrow: FAQ
    title: Frequently asked questions
    items:
      - q: What is a Digital Payment Note (DPN)?
        a: "A DPN is a digital record of a payer's commitment to pay a supplier a set amount on a set date. It is issued and tracked on a blockchain ledger, so ownership and history are always verifiable."
      - q: How does a supplier get paid early?
        a: "Once the supplier holds a DPN, it can sell the note to a participating funder and receive payment before the due date. At maturity, the payer pays the funder."
      - q: Does the payer have to change its payment terms?
        a: "No. The payer keeps its existing terms and pays on the original due date — to whoever holds the note at that time."
      - q: What happens after I leave my details?
        a: "We schedule a short, free and non-binding introductory call to understand your needs and suggest next steps."
      - q: Is my inquiry confidential?
        a: "Yes. All inquiries are handled in full confidence and nothing is shared with any party without your explicit consent."
  cta:
    title: "Ready to unlock your supply chain's liquidity?"
    text: "Tell us whether you pay, supply or fund — we'll show you how DPN fits."
    button: Get started

dpn:
  title: "DPN Platform — Digital Payment Notes on blockchain | INORI"
  description: "The DPN platform issues, transfers and settles digital payment notes on a blockchain ledger, enabling supplier factoring with full transparency."
  hero:
    eyebrow: The platform
    title: "Digital Payment Notes, on a ledger you can trust."
    subtitle: "A blockchain-powered factoring platform that turns approved supplier payments into transferable digital notes."
  what:
    eyebrow: What is DPN
    title: "A payment promise, made digital and transferable"
    paragraphs:
      - "A Digital Payment Note represents a payer's commitment to pay an approved amount to a supplier on a fixed date. Instead of a paper promissory note or an invoice waiting in a queue, it is issued as a digital asset on a permissioned blockchain ledger."
      - "Because the note can be transferred, the supplier can sell it to a funder and receive cash early. Every issuance, transfer and settlement is recorded — creating a single, verifiable source of truth for all parties."
  platform:
    eyebrow: Inside the platform
    title: "Built for payers, suppliers and funders"
    text: "Each participant gets a dedicated workspace to issue, receive, trade and settle notes."
  benefits:
    eyebrow: Why DPN
    items:
      - icon: clock
        title: Faster liquidity
        text: "Suppliers can turn approved payments into cash without waiting for the due date."
      - icon: ledger
        title: Single source of truth
        text: "Issuance, ownership and settlement are recorded on a shared, tamper-proof ledger."
      - icon: search
        title: Full transparency
        text: "Payers, suppliers and funders see the same verified status of every note."
      - icon: scales
        title: Regulated framework
        text: "Operated by a company licensed by the Israel Capital Market Authority."
  security:
    eyebrow: Security & compliance
    title: "Immutable records. Verified ownership."
    text: "DPN runs on Hyperledger Iroha, an enterprise-grade permissioned blockchain. Only authorised participants can transact, and every change of ownership is permanently recorded."
    points:
      - Permissioned network with identified participants
      - Tamper-proof history of every note
      - Clear ownership at every moment
      - Designed to support regulatory and audit requirements
  video:
    title: "See DPN in action"
    text: "A short walkthrough of how a digital payment note moves from payer to supplier to funder."

solutions:
  payers:
    title: "DPN for payers — corporates and public bodies | INORI"
    description: "Support your suppliers with early payment while keeping your payment terms and full visibility."
    hero:
      eyebrow: For payers
      title: "Strengthen your supply chain without changing your terms."
      subtitle: "Corporates and public bodies use DPN to give suppliers access to early payment — while paying on the original due date."
    intro: "Long payment terms protect your cash flow but strain your suppliers. DPN lets you keep both: you issue a digital note for each approved payment, and your suppliers decide when to turn it into cash."
    benefits:
      - icon: tower
        title: Keep your payment terms
        text: "You pay on the agreed due date — to the current holder of the note."
      - icon: search
        title: Full visibility
        text: "Track every issued note, its holder and its status in one place."
      - icon: supplier
        title: Healthier suppliers
        text: "Suppliers with access to liquidity are more stable and reliable partners."
      - icon: invoice
        title: Less paperwork
        text: "Replace manual confirmations and paper notes with a digital, auditable process."
    flow_title: "Your role in the flow"
    flow:
      - "Approve the supplier's invoice as usual."
      - "Issue a DPN for the approved amount and due date."
      - "Pay the holder of the note on maturity."
  suppliers:
    title: "DPN for suppliers — get paid early | INORI"
    description: "Turn approved payments into cash when you need it instead of waiting months."
    hero:
      eyebrow: For suppliers
      title: "Your approved payments, available when you need them."
      subtitle: "Receive a digital payment note from your customer and choose: hold it to maturity or sell it for early payment."
    intro: "Waiting 60, 90 or 120 days for payment slows growth. With DPN, an approved payment becomes a digital note you can turn into cash — backed by your customer's commitment, not by your own balance sheet."
    benefits:
      - icon: clock
        title: Get paid early
        text: "Sell your note to a participating funder and receive cash before the due date."
      - icon: note
        title: Clear and verifiable
        text: "Amount, due date and payer are recorded on the ledger — no disputes about what was approved."
      - icon: chart
        title: Plan your growth
        text: "Predictable cash flow helps you take on new orders and projects."
      - icon: exchange
        title: Your choice
        text: "Decide per note whether to wait or receive early payment."
    flow_title: "Your role in the flow"
    flow:
      - "Deliver and invoice your customer as usual."
      - "Receive a DPN once the payment is approved."
      - "Hold it, or sell it to a funder for early payment."
  funders:
    title: "DPN for funders — banks and factoring companies | INORI"
    description: "Invest in verified, payer-backed receivables with transparent ownership."
    hero:
      eyebrow: For funders
      title: "Verified receivables, with ownership you can see."
      subtitle: "Banks and factoring companies use DPN to finance supplier payments backed by approved payer commitments."
    intro: "Traditional factoring relies on documents that are hard to verify and easy to duplicate. DPN gives you notes whose issuance, ownership and settlement are recorded on a shared ledger — reducing operational risk and verification effort."
    benefits:
      - icon: vault
        title: Payer-backed assets
        text: "Each note represents an approved payment commitment by an identified payer."
      - icon: ledger
        title: No double financing
        text: "A single ledger record means a note cannot be sold twice."
      - icon: search
        title: Faster due diligence
        text: "Verify amount, payer, maturity and ownership history instantly."
      - icon: chart
        title: Scalable deal flow
        text: "Access notes across many suppliers through one platform."
    flow_title: "Your role in the flow"
    flow:
      - "Review available notes and their payers."
      - "Purchase notes and pay suppliers early."
      - "Receive payment from the payer at maturity."

services:
  title: "Services — regulation, payment processes and implementation | INORI"
  description: "Regulatory and licensing support, payment-cycle optimisation and implementation services from INORI."
  hero:
    eyebrow: Services
    title: "From strategy to execution."
    subtitle: "Tailored financial and regulatory services for government bodies, institutions and businesses — with clarity, stability and discretion."
  items:
    - img: services_regulatory
      title: Regulatory & licensing support
      text: "We guide institutions through the regulatory landscape of payments and digital assets — from structuring to working with regulators and banks."
      points:
        - Regulatory mapping and structuring
        - Licensing processes and documentation
        - Coordination with regulators and banks
    - img: services_optimization
      title: Payment-cycle & working-capital optimisation
      text: "We analyse how money moves between you and your suppliers and redesign the process to free working capital."
      points:
        - Analysis of payment terms and flows
        - Supply-chain finance programme design
        - Onboarding of suppliers and funders
    - img: services_integration
      title: Implementation & integration
      text: "We work with your finance and IT teams to connect DPN to your existing processes and systems."
      points:
        - Process and integration planning
        - Pilot setup and rollout
        - Ongoing operational support
  note: "We work alongside your accountants and lawyers — not instead of them — and lead the practical process with banking and regulatory bodies."

technology:
  title: "Technology — Hyperledger Iroha and Soramitsu | INORI"
  description: "DPN is built on Hyperledger Iroha, in strategic partnership with Soramitsu."
  hero:
    eyebrow: Technology
    title: "Enterprise blockchain, designed for finance."
    subtitle: "DPN runs on Hyperledger Iroha — a permissioned distributed ledger built for regulated financial infrastructure."
  ledger:
    eyebrow: The ledger
    title: "Why a distributed ledger?"
    text: "Factoring depends on trust: that a payment was approved, that a note exists only once, and that its owner is who they claim to be. A shared ledger gives every participant the same verified record — without relying on emails, spreadsheets or paper."
    points:
      - icon: ledger
        title: Shared record
        text: "All authorised parties see the same state of every note."
      - icon: shield
        title: Tamper-proof
        text: "History cannot be altered after the fact."
      - icon: exchange
        title: Instant transfer
        text: "Ownership moves between parties in a single recorded step."
  iroha:
    title: Hyperledger Iroha
    text: "An open-source, permissioned blockchain under the Linux Foundation's Hyperledger project, designed for digital assets, identity and payment systems in regulated environments."
  partnership:
    eyebrow: Strategic partnership
    title: "In partnership with Soramitsu"
    text: "INORI is the official Israeli partner of Soramitsu, a leading developer of blockchain-based financial infrastructure and central bank digital currency systems, and a core developer of Hyperledger Iroha. The partnership brings proven technology and international standards for security, privacy and interoperability to the Israeli market."

about:
  title: "About INORI Finance"
  description: "INORI is a licensed Israeli fintech building blockchain-based payment infrastructure, in partnership with Soramitsu."
  hero:
    eyebrow: About us
    title: "A new financial vision."
    subtitle: "Finance is a service — and the end user is at the centre."
  story:
    title: Who we are
    paragraphs:
      - "INORI is a strategy and technology team focused on digital payment infrastructure, financial regulation and blockchain applications. We provide tailored financial and regulatory services to government bodies, institutions and businesses — and build the DPN platform for supplier payments."
      - "Our team brings together advisors with financial, legal and regulatory backgrounds, lawyers specialising in digital assets and payment regulation, and technologists experienced in distributed-ledger projects on Hyperledger Iroha."
      - "Through our strategic partnership with Soramitsu, we bring international standards of security, privacy and interoperability — to deliver a financial service layer that is transparent, precise, calm and efficient."
