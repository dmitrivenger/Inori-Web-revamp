legal:
  updated: "Last updated: November 2026"
  terms:
    title: Terms of use
    sections:
      - h: General
        p: "This website is operated by INORI Finance Ltd. (\"INORI\"). By using the website you agree to these terms. If you do not agree, please do not use the website."
      - h: Information only
        p: "The content of the website is provided for general information only. It does not constitute investment, financial, legal, tax or credit advice, nor an offer or solicitation to purchase any financial product. Any service is provided only under a separate agreement and subject to applicable law."
      - h: Intellectual property
        p: "All content on the website, including text, graphics, logos and software, is owned by INORI or its licensors and may not be copied or used without prior written permission."
      - h: Limitation of liability
        p: "INORI makes reasonable efforts to keep the information accurate and up to date but does not guarantee its completeness or accuracy. INORI shall not be liable for any damage resulting from the use of the website or reliance on its content."
      - h: External links
        p: "The website may contain links to third-party websites. INORI is not responsible for their content or privacy practices."
      - h: Changes
        p: "INORI may update these terms and the website content at any time without prior notice."
      - h: Governing law
        p: "These terms are governed by the laws of the State of Israel. The competent courts in Israel shall have exclusive jurisdiction."
  privacy:
    title: Privacy policy
    sections:
      - h: Who we are
        p: "INORI Finance Ltd., Petah Tikva, Israel, is responsible for the personal information collected through this website."
      - h: What we collect
        p: "When you contact us we collect the details you provide — such as name, company, e-mail, phone and message. We may also collect basic technical information needed to operate the website."
      - h: How we use it
        p: "We use your details only to respond to your inquiry, to provide our services and to comply with legal obligations. We do not sell your information."
      - h: Sharing
        p: "We do not share your details with third parties without your consent, except with service providers that help us operate the website, or where required by law."
      - h: Cookies
        p: "The website uses only cookies and local storage that are necessary for its operation, such as remembering your language choice."
      - h: Your rights
        p: "You may request to access, correct or delete your personal information under the Israeli Privacy Protection Law. To do so, contact us at kobis@inori.co.il."
  accessibility:
    title: Accessibility statement
    sections:
      - h: Our commitment
        p: "INORI is committed to making its website accessible to all users, including people with disabilities, in accordance with the Equal Rights for Persons with Disabilities (Service Accessibility Adjustments) Regulations, 2013."
      - h: Accessibility level
        p: "The website was designed to comply with Israeli Standard IS 5568, based on WCAG 2.0 at level AA. It supports keyboard navigation, screen readers, text resizing, sufficient colour contrast and descriptive alternative text."
      - h: Limitations
        p: "Despite our efforts, some content — such as third-party videos or external documents — may not yet be fully accessible. We are working to improve it continuously."
      - h: Contact the accessibility coordinator
        p: "If you encounter an accessibility issue, please contact us at kobis@inori.co.il or 054-592-0898 and we will do our best to resolve it promptly."
  regulatory:
    title: Regulatory information
    sections:
      - h: Licensing
        p: "INORI Finance Ltd. operates with the approval of the Israel Capital Market Authority under licenses No. 70208 and 70210."
      - h: Nature of the information
        p: "The information on this website is general and is not a substitute for advice that takes into account your specific circumstances. Services are provided only under an agreement and subject to applicable regulation."
      - h: Complaints
        p: "Inquiries and complaints may be sent to kobis@inori.co.il."

